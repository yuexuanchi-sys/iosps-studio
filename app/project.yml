name: IOSPS
options:
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ARCHS: arm64
packages:
  IOSPSModules:
    path: .
targets:
  AppMac:
    type: application
    platform: macOS
    sources:
      - Apps/Mac
      - path: Resources/Notices
        type: folder
        buildPhase: resources
    dependencies:
      - package: IOSPSModules
        product: DesignSystem
      - package: IOSPSModules
        product: MediaIO
      - package: IOSPSModules
        product: GiftKit
      - package: IOSPSModules
        product: BirthdayCore
      - package: IOSPSModules
        product: TimelineKit
      - package: IOSPSModules
        product: VideoEngine
    settings:
      base:
        PRODUCT_NAME: IOSPS
        PRODUCT_BUNDLE_IDENTIFIER: org.iosps.birthday
        GENERATE_INFOPLIST_FILE: "YES"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
      configs:
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: "NO"
  AppMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/AppMacTests
      - Tests/MediaIOTests/SyntheticMediaFixtures.swift
      - path: Tests/VideoEditorFixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: AppMac
      - package: IOSPSModules
        product: TemplateKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.iosps.birthday.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/IOSPS.app/Contents/MacOS/IOSPS
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
  AppMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - Tests/AppMacUITests
      - path: Tests/VideoEditorFixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: AppMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.iosps.birthday.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: AppMac
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
schemes:
  AppMac:
    build:
      targets:
        AppMac: all
        AppMacTests: [test]
        AppMacUITests: [test]
    test:
      config: Debug
      targets:
        - AppMacTests
        - AppMacUITests
