name: macOS CI

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/ci.yml'
      - 'tools/check_repo.py'
      - '.gitignore'
      - '.gitattributes'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/ci.yml'
      - 'tools/check_repo.py'
      - '.gitignore'
      - '.gitattributes'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Print runner and validate repository
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          swift --version
          python3 tools/check_repo.py
      - name: Run Swift package tests
        run: swift test --package-path app
      - name: Fetch pinned XcodeGen
        env:
          XCODEGEN_VERSION: "2.48.0"
          XCODEGEN_SHA256: "620c9f0dc10849f94728ab5df52d225ebab8187439dd6fee1925e59e80dff892"
        run: |
          tools_dir="$RUNNER_TEMP/iosps-xcodegen"
          mkdir -p "$tools_dir"
          curl --fail --silent --show-error --location --retry 3 --output "$tools_dir/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          printf '%s  %s\n' "$XCODEGEN_SHA256" "$tools_dir/xcodegen.zip" | shasum -a 256 -c -
          ditto -x -k "$tools_dir/xcodegen.zip" "$tools_dir"
          executable="$(find "$tools_dir" -type f -name xcodegen -print -quit)"
          test -n "$executable"
          test -x "$executable"
          "$executable" --version
          dirname "$executable" >> "$GITHUB_PATH"
      - name: Build arm64 Mac app
        working-directory: app
        run: |
          xcodegen generate
          time xcodebuild -project IOSPS.xcodeproj -scheme AppMac -configuration Release \
            -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/iosps-build" build
      - name: Test AppMac host
        working-directory: app
        run: |
          xcodebuild -project IOSPS.xcodeproj -scheme AppMac -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/iosps-build" \
            -resultBundlePath "$RUNNER_TEMP/iosps-tests.xcresult" \
            -parallel-testing-enabled NO test
      - name: Export AppMac UI evidence
        run: |
          output="$RUNNER_TEMP/iosps-artifacts/license-window"
          mkdir -p "$output"
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/iosps-tests.xcresult" \
            --output-path "$output" \
            --test-id 'LicenseNoticeUITests/testAboutMenuShowsLocalLicenseAndKeyboardChangesSelection()'
          grep -F 'about-licenses' "$output/manifest.json"
          output="$RUNNER_TEMP/iosps-artifacts/birthday-control"
          mkdir -p "$output"
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/iosps-tests.xcresult" \
            --output-path "$output" \
            --test-id 'BirthdayHomeUITests/testAppStartsOnBirthdayHomeAndKeyboardOpensEasterEggEntry()'
          grep -F 'birthday-egg-control' "$output/manifest.json"
          grep -F 'birthday-home' "$output/manifest.json"
          output="$RUNNER_TEMP/iosps-artifacts/birthday-celebration"
          mkdir -p "$output"
          for scenario in testBirthdayFirstLaunchSkipReopenAndReplay testEggRequiresThreeClicksAndKeyboardCanOpenIt; do
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/iosps-tests.xcresult" \
              --output-path "$output/$scenario" --test-id "BirthdayCelebrationUITests/$scenario()"
          done
          grep -F 'birthday-celebration-static' "$output/testBirthdayFirstLaunchSkipReopenAndReplay/manifest.json"
          grep -F 'birthday-easter-egg-open' "$output/testEggRequiresThreeClicksAndKeyboardCanOpenIt/manifest.json"
      - name: Render greeting and package app
        run: |
          output="$RUNNER_TEMP/iosps-artifacts"
          app="$RUNNER_TEMP/iosps-build/Build/Products/Release/IOSPS.app"
          mkdir -p "$output"
          swift run --package-path app BirthdaySmokeSnapshot "$output/birthday-smoke.png"
          sips -g pixelWidth -g pixelHeight "$output/birthday-smoke.png" | tee "$output/snapshot-size.txt"
          grep -F 'pixelWidth: 720' "$output/snapshot-size.txt"
          grep -F 'pixelHeight: 480' "$output/snapshot-size.txt"
          swift run --package-path app BirthdaySmokeSnapshot --variants "$output/snapshots"
          for variant in light dark large; do
            sips -g pixelWidth -g pixelHeight "$output/snapshots/birthday-$variant.png" | tee -a "$output/snapshot-size.txt"
          done
          sips -g pixelWidth -g pixelHeight "$output/snapshots/birthday-narrow.png" | tee -a "$output/snapshot-size.txt"
          test "$(grep -c 'pixelWidth: 1280' "$output/snapshot-size.txt")" = 3
          test "$(grep -c 'pixelHeight: 800' "$output/snapshot-size.txt")" = 3
          grep -F 'pixelWidth: 430' "$output/snapshot-size.txt"
          grep -F 'pixelHeight: 720' "$output/snapshot-size.txt"
          test "$(shasum -a 256 "$output"/snapshots/*.png | awk '{ print $1 }' | sort -u | wc -l | tr -d ' ')" = 4
          test "$(lipo -archs "$app/Contents/MacOS/IOSPS")" = arm64
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=4 "$app" 2>&1 | tee "$output/signature.txt"
          grep -F 'Signature=adhoc' "$output/signature.txt"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$output/IOSPS.app.zip"
          unzip -Z1 "$output/IOSPS.app.zip" | grep -Fx 'IOSPS.app/Contents/MacOS/IOSPS'
          archive_check="$RUNNER_TEMP/iosps-package-check"
          ditto -x -k "$output/IOSPS.app.zip" "$archive_check"
          signed_app="$archive_check/IOSPS.app"
          executable="$signed_app/Contents/MacOS/IOSPS"
          codesign --verify --deep --strict --verbose=2 "$signed_app"
          test "$(lipo -archs "$executable")" = arm64
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$signed_app/Contents/Info.plist")" = 14.0
          xcrun vtool -show-build "$executable" | tee "$output/build-target.txt"
          grep -Eq '^[[:space:]]+minos 14\.0$' "$output/build-target.txt"
          codesign -d --entitlements - "$signed_app" > "$output/signed-entitlements.plist"
          python3 - "$output/signed-entitlements.plist" <<'PY' | tee "$output/signed-entitlements.txt"
          import plistlib
          import sys
          from pathlib import Path

          payload = Path(sys.argv[1]).read_bytes()
          signed = plistlib.loads(payload) if payload else {}
          if signed != {}:
              raise SystemExit(f"Unexpected Release entitlements: {signed}")
          print("Release signed entitlements: {}")
          PY
          diff -rq app/Resources/Notices "$signed_app/Contents/Resources/Notices"
          (cd "$output" && shasum -a 256 IOSPS.app.zip > IOSPS.app.zip.sha256)
          open -n "$signed_app"
          for attempt in {1..10}; do
            if lsof -a -c IOSPS -d txt -Fn | grep -Fx "n$executable"; then
              break
            fi
            sleep 1
          done
          lsof -a -c IOSPS -d txt -Fn | grep -Fx "n$executable" | tee "$output/launched-executable.txt"
          shasum -a 256 "$executable" | tee -a "$output/launched-executable.txt"
      - name: Upload Mac build artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: iosps-macos-build
          path: |
            ${{ runner.temp }}/iosps-artifacts/birthday-smoke.png
            ${{ runner.temp }}/iosps-artifacts/snapshots/
            ${{ runner.temp }}/iosps-artifacts/license-window/
            ${{ runner.temp }}/iosps-artifacts/birthday-control/
            ${{ runner.temp }}/iosps-artifacts/birthday-celebration/
            ${{ runner.temp }}/iosps-artifacts/snapshot-size.txt
            ${{ runner.temp }}/iosps-artifacts/signature.txt
            ${{ runner.temp }}/iosps-artifacts/build-target.txt
            ${{ runner.temp }}/iosps-artifacts/signed-entitlements.txt
            ${{ runner.temp }}/iosps-artifacts/launched-executable.txt
            ${{ runner.temp }}/iosps-artifacts/IOSPS.app.zip
            ${{ runner.temp }}/iosps-artifacts/IOSPS.app.zip.sha256
          if-no-files-found: error
          retention-days: 7
