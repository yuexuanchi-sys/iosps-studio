name: macOS CI

on:
  workflow_dispatch:
    inputs:
      license_copy_only:
        description: Verify copying license text from the signed Release
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

defaults:
  run:
    shell: bash

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Identify runner and test source
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          swift --version
          git rev-parse HEAD
          app_sha=52a41a8b14fda7ea614e3c64b0ae9f1c7c84396e
          git merge-base --is-ancestor "$app_sha" HEAD
          git diff --exit-code "$app_sha" HEAD -- app/Apps/Mac app/Sources app/Package.swift app/Resources
          python3 tools/check_repo.py
          mkdir -p "$RUNNER_TEMP/iosps-self-test-evidence"
      - name: Verify original signed candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          evidence="$RUNNER_TEMP/iosps-self-test-evidence"
          bundle_dir="/tmp/iosps-ci-self-test"
          archive_dir="$RUNNER_TEMP/iosps-release-download"
          mkdir "$bundle_dir"
          gh run download 45428067451 --repo "$GITHUB_REPOSITORY" --name iosps-macos-build --dir "$archive_dir"
          (
            cd "$archive_dir"
            printf '%s  IOSPS.app.zip\n' e0e79c9cfef72d460d4325d94b5f4ef6829da5213c24c5f9ae7ce38787c2f0c8 |
              shasum -a 256 -c -
            shasum -a 256 -c IOSPS.app.zip.sha256
          ) | tee "$evidence/candidate-archive.txt"
          ditto -x -k "$archive_dir/IOSPS.app.zip" "$bundle_dir"
          codesign --verify --deep --strict --verbose=2 "$bundle_dir/IOSPS.app" 2>&1 |
            tee "$evidence/candidate-signature.txt"
          printf '%s  %s\n' 344b4461a3646b21de46bef1b217a3def8355aaed6603a905583672311c6d208 \
            "$bundle_dir/IOSPS.app/Contents/MacOS/IOSPS" | shasum -a 256 -c - |
            tee "$evidence/candidate-executable.txt"
      - name: Prepare shared synthetic media
        if: ${{ !inputs.license_copy_only }}
        run: |
          fixtures="app/Tests/ReleaseCandidateFixtures"
          test_dir="/tmp/iosps-ci-self-test"
          mkdir "$test_dir/picker-inputs" "$test_dir/finder-inputs" "$test_dir/permission-input"
          cp "$fixtures/portrait.jpg" "$fixtures/landscape.png" "$fixtures/source-a.mov" "$fixtures/source-b.mp4" \
            "$test_dir/picker-inputs/"
          sips -s format heic "$test_dir/picker-inputs/landscape.png" --out "$test_dir/picker-inputs/landscape.heic"
          cp "$test_dir/picker-inputs/"* "$fixtures/broken.png" "$fixtures/notes.txt" "$test_dir/finder-inputs/"
          cp "$fixtures/landscape.png" "$test_dir/permission-input/denied.png"
          chmod 000 "$test_dir/permission-input/denied.png"
      - name: Fetch pinned XcodeGen
        env:
          XCODEGEN_VERSION: "2.48.0"
          XCODEGEN_SHA256: "620c9f0dc10849f94728ab5df52d225ebab8187439dd6fee1925e59e80dff892"
        run: |
          tools_dir="$RUNNER_TEMP/iosps-xcodegen"
          mkdir -p "$tools_dir"
          curl --fail --silent --show-error --location --retry 3 --output "$tools_dir/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          printf '%s  %s\n' "$XCODEGEN_SHA256" "$tools_dir/xcodegen.zip" | shasum -a 256 -c -
          ditto -x -k "$tools_dir/xcodegen.zip" "$tools_dir"
          executable="$(find "$tools_dir" -type f -name xcodegen -print -quit)"
          test -x "$executable"
          dirname "$executable" >> "$GITHUB_PATH"
      - name: Test signed Release through native UI
        if: ${{ !inputs.license_copy_only }}
        working-directory: app
        run: |
          xcodegen generate
          xcodebuild -project IOSPS.xcodeproj -scheme AppMac -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/iosps-ui-build" \
            -resultBundlePath "$RUNNER_TEMP/iosps-ui-tests.xcresult" \
            -parallel-testing-enabled NO -only-testing:AppMacUITests/ReleaseCandidateUITests \
            -skip-testing:AppMacUITests/ReleaseCandidateUITests/testCopiesDisplayedLicenseText test 2>&1 |
            while IFS= read -r line; do
              printf '%s\n' "$line"
              if [[ "$line" == IOSPS_SELF_TEST_RESTORE_PERMISSION ]]; then
                chmod 600 /tmp/iosps-ci-self-test/permission-input/denied.png
                echo 'Restored read access for the same synthetic PNG.'
              fi
            done
      - name: Copy license text from signed Release
        if: ${{ inputs.license_copy_only }}
        working-directory: app
        run: |
          xcodegen generate
          xcodebuild -project IOSPS.xcodeproj -scheme AppMac -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/iosps-ui-build" \
            -resultBundlePath "$RUNNER_TEMP/iosps-ui-tests.xcresult" \
            -parallel-testing-enabled NO \
            -only-testing:AppMacUITests/ReleaseCandidateUITests/testCopiesDisplayedLicenseText test
      - name: Export native UI evidence
        if: always()
        run: |
          result="$RUNNER_TEMP/iosps-ui-tests.xcresult"
          evidence="$RUNNER_TEMP/iosps-self-test-evidence"
          if [[ -d "$result" ]]; then
            xcrun xcresulttool get test-results summary --path "$result" > "$evidence/test-summary.json"
            xcrun xcresulttool export attachments --path "$result" --output-path "$evidence/attachments"
          fi
      - name: Read back published synthetic media
        if: ${{ always() && !inputs.license_copy_only }}
        run: |
          evidence="$RUNNER_TEMP/iosps-self-test-evidence"
          if [[ -f "$evidence/test-summary.json" ]]; then
            python3 - "$evidence/test-summary.json" <<'PY' | tee "$evidence/media-readback.txt"
          from collections import Counter
          from hashlib import sha256
          from pathlib import Path
          import json
          import sys

          summary = json.loads(Path(sys.argv[1]).read_text())
          media = Path.home() / 'Library/Application Support/org.iosps.birthday/Media'
          print(f'Runner media directory: {media}, exists: {media.is_dir()}')
          inputs = Path('/tmp/iosps-ci-self-test/picker-inputs')
          expected = Counter()
          for file in sorted(inputs.iterdir()):
              digest = sha256(file.read_bytes()).hexdigest()
              expected[file.suffix, digest] += 3 if file.name in {'portrait.jpg', 'landscape.png'} else 2
          seen = Counter()
          for directory in sorted(media.iterdir()) if media.is_dir() else []:
              if directory.name.startswith('.'):
                  continue
              originals = list(directory.glob('original.*'))
              assert len(originals) == 1, directory
              original = originals[0]
              preview = directory / 'preview.png'
              assert preview.read_bytes().startswith(b'\x89PNG\r\n\x1a\n'), directory
              seen[original.suffix, sha256(original.read_bytes()).hexdigest()] += 1
          print(f'Published copies with PNG previews: {sum(seen.values())}; expected on full pass: {sum(expected.values())}')
          print(f'Published counts by type: {sorted((extension, count) for (extension, _), count in seen.items())}')
          if summary['passedTests'] == 3 and summary['failedTests'] == 0:
              assert seen == expected, (seen, expected)
              print('All twelve published originals match their synthetic input bytes.')
          PY
          fi
      - name: Upload self-test evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: iosps-release-self-test
          path: ${{ runner.temp }}/iosps-self-test-evidence/
          if-no-files-found: error
          retention-days: 7
